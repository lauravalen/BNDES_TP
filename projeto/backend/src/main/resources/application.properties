# =============================================
# CONFIGURAÇÃO DO BANCO H2 (em memória)
# =============================================
# Os dados sao carregados automaticamente do CSV
# que está em src/main/resources/ pelo DataLoader
# Veja: config/DataLoader.java

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:saftbndes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

# =============================================
# CONFIGURA��O DO SERVIDOR
# =============================================
server.port=8080

# =============================================
# LIMITE DE TAMANHO DO UPLOAD DE ARQUIVO CSV
# =============================================
# Permite arquivos de ate 200MB (CSVs do BNDES podem ser grandes)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
