# =============================================
# CONFIGURAÇÃO DO BANCO H2 (em memória)
# =============================================

# Habilita o console visual do H2 (acesse: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL do banco em memória
spring.datasource.url=jdbc:h2:mem:saftbndes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mostra os SQLs gerados no console (útil para aprendizado)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cria as tabelas automaticamente a partir das entidades @Entity
spring.jpa.hibernate.ddl-auto=create-drop

# =============================================
# CONFIGURAÇÃO DO SERVIDOR
# =============================================
server.port=8080
