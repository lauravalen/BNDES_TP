# =============================================
# CONFIGURA��O DO BANCO H2 (em mem�ria)
# =============================================

# Habilita o console visual do H2 (acesse: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL do banco em mem�ria
spring.datasource.url=jdbc:h2:mem:saftbndes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mostra os SQLs gerados no console (�til para aprendizado)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cria as tabelas automaticamente a partir das entidades @Entity
spring.jpa.hibernate.ddl-auto=create-drop

# =============================================
# CONFIGURA��O DO SERVIDOR
# =============================================
server.port=8080

# =============================================
# LIMITE DE TAMANHO DO UPLOAD DE ARQUIVO CSV
# =============================================
# Permite arquivos de ate 200MB (CSVs do BNDES podem ser grandes)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
